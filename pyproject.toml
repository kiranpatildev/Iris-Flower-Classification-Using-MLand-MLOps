[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iris-flow"
version = "0.1.0"
description = "Iris classification MLOps demo"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "scikit-learn>=1.5,<2", "pandas>=2.2,<3", "joblib>=1.4,<2",
  "mlflow>=2.16,<4", "dvc>=3.50,<4", "PyYAML>=6,<7"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

